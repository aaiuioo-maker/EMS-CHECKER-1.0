<meta name="theme-color" content="#0a0f1e">
<title>米国EMSチェッカー</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0f1e;--surface:#111827;--surface2:#1a2338;--border:#2a3a5c;
  --text:#e8edf5;--text2:#8899bb;--text3:#4a5a7a;
  --accent:#4f8ef7;--green:#22c98a;--amber:#f5a623;--red:#e85555;
  --radius:16px;
  --safe-top:env(safe-area-inset-top,20px);
  --safe-bottom:env(safe-area-inset-bottom,20px);
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,'Hiragino Sans',sans-serif;overflow:hidden}
.app{display:flex;flex-direction:column;height:100vh;max-width:430px;margin:0 auto}

/* ===== OPENING ===== */
#opening{position:absolute;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0a0f1e;padding:32px 24px;max-width:430px;margin:0 auto}
#opening.hide{animation:fadeOut .6s forwards}
@keyframes fadeOut{to{opacity:0;pointer-events:none}}
.op-flag{width:100%;max-width:280px;margin-bottom:20px;border-radius:8px;overflow:hidden;box-shadow:0 0 40px rgba(79,142,247,.25)}
.op-flag svg{display:block;width:100%}
.op-trump{font-size:100px;line-height:1;margin-bottom:4px;animation:bob 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.op-title{font-size:22px;font-weight:700;color:#e8edf5;letter-spacing:.04em;margin-bottom:4px;text-align:center}
.op-sub{font-size:13px;color:#8899bb;margin-bottom:28px;text-align:center}
.op-btn{padding:16px 48px;background:var(--accent);color:#fff;font-size:17px;font-weight:700;border:none;border-radius:50px;cursor:pointer;font-family:inherit;letter-spacing:.04em;box-shadow:0 0 24px rgba(79,142,247,.4);animation:glow 2s ease-in-out infinite;-webkit-appearance:none}
@keyframes glow{0%,100%{box-shadow:0 0 20px rgba(79,142,247,.4)}50%{box-shadow:0 0 40px rgba(79,142,247,.8)}}
.op-btn:active{transform:scale(.96)}
.header{padding:calc(var(--safe-top) + 10px) 20px 10px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.header-title{font-size:15px;font-weight:600}
.rate-chip{display:flex;align-items:center;gap:5px;font-size:12px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:5px 11px;cursor:pointer}
.rate-dot{width:6px;height:6px;border-radius:50%;background:var(--text3);flex-shrink:0;transition:background .4s}
.rate-dot.ok{background:var(--green)}
.rate-dot.loading{background:var(--amber);animation:pulse 1s infinite}
.rate-dot.err{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.chip-val{font-weight:600;color:var(--text)}
.chip-lbl{color:var(--text3)}
.tabbar{display:flex;background:var(--surface);border-top:1px solid var(--border);padding-bottom:var(--safe-bottom);flex-shrink:0}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0;cursor:pointer;color:var(--text3);font-size:10px;transition:color .2s}
.tab.active{color:var(--accent)}
.tab svg{width:22px;height:22px}
.screens{flex:1;overflow:hidden;position:relative}
.screen{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px;opacity:0;pointer-events:none;transition:opacity .2s}
.screen.active{opacity:1;pointer-events:all}
.track{display:flex;gap:5px;margin-bottom:16px}
.pip{height:3px;flex:1;border-radius:2px;background:var(--border);transition:background .3s}
.pip.done{background:var(--green)}
.pip.active{background:var(--accent)}
.q-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:12px}
.q-step{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--text3);margin-bottom:6px}
.q-text{font-size:17px;font-weight:600;line-height:1.45;margin-bottom:6px}
.q-sub{font-size:13px;color:var(--text2);line-height:1.6}
.btn-row{display:flex;gap:10px;margin-bottom:12px}
.btn{flex:1;padding:14px;border-radius:12px;border:none;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;transition:transform .1s;-webkit-appearance:none}
.btn:active{transform:scale(.96)}
.btn-yes{background:var(--green);color:#03200f}
.btn-no{background:var(--surface2);color:var(--text2);border:1px solid var(--border)}
.hlist{margin-bottom:14px}
.hrow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px}
.hrow:last-child{border-bottom:none}
.hq{color:var(--text2);flex:1;padding-right:10px;line-height:1.4}
.ha{font-weight:600}
.ha.yes{color:var(--green)}
.ha.no{color:var(--red)}
.rcard{border-radius:var(--radius);padding:18px;margin-bottom:12px}
.rcard.ok{background:#0b2a1e;border:1px solid #1a5a3a}
.rcard.warn{background:#1f1700;border:1px solid #5a3a00}
.rcard.steps{background:#0a1628;border:1px solid #1a3060}
.rbadge{display:inline-flex;font-size:11px;font-weight:700;letter-spacing:.07em;border-radius:6px;padding:3px 9px;margin-bottom:8px}
.rbadge.ok{background:#0d3a25;color:#22c98a}
.rbadge.warn{background:#2a1a00;color:#f5a623}
.rbadge.steps{background:#0d1f42;color:#4f8ef7}
.rtitle{font-size:17px;font-weight:700;margin-bottom:6px}
.rtitle.ok{color:#b0f0d5}
.rtitle.warn{color:#ffd080}
.rtitle.steps{color:#a0c4ff}
.rbody{font-size:14px;line-height:1.7;color:var(--text2)}
.srow{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.snum{min-width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.stext{font-size:14px;color:#a0c4ff;line-height:1.6}
.rnote{font-size:12px;color:var(--text3);border-top:1px solid var(--border);padding-top:10px;margin-top:10px;line-height:1.6}
.reset-btn{width:100%;padding:14px;background:var(--surface2);border:1px solid var(--border);border-radius:12px;color:var(--text2);font-size:15px;font-weight:500;cursor:pointer;font-family:inherit}
.reset-btn:active{background:var(--border)}
.fx-rate-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;margin-bottom:7px}
.fx-rate-row{display:flex;align-items:center;gap:8px}
.fx-rate-label{font-size:12px;color:var(--text3);white-space:nowrap}
.fx-rate-input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:34px;font-weight:700;color:var(--text);font-family:inherit;outline:none;text-align:right;width:0;min-width:0;-webkit-appearance:none}
.fx-rate-input:focus{border-color:var(--accent)}
.fx-unit{font-size:13px;color:var(--text3)}
.fx-updated{font-size:10px;color:var(--text3);margin-top:3px;text-align:right;min-height:13px}
.dir-row{display:flex;gap:8px;margin-bottom:7px}
.dir-btn{flex:1;padding:9px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;font-family:inherit;transition:background .15s,color .15s,border-color .15s;-webkit-appearance:none}
.dir-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.fx-amount-wrap{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:6px 12px;margin-bottom:6px;text-align:center}
.fx-dir-label{font-size:10px;color:var(--text3);margin-bottom:1px}
.fx-amount-disp{font-size:36px;font-weight:700;color:var(--text);min-height:40px;line-height:1.1;word-break:break-all}
.fx-amount-disp.empty{color:var(--text3)}
.fx-amount-wrap.has-value{border-color:var(--accent)}
.fx-result-card{background:var(--surface2);border:1px solid var(--accent);border-radius:var(--radius);padding:6px 12px;text-align:center;margin-bottom:7px}
.fx-result-label{font-size:10px;color:var(--text3);margin-bottom:0}
.fx-result-amount{font-size:32px;font-weight:700;color:var(--accent)}
.fx-result-unit{font-size:13px;color:var(--text2);margin-left:4px}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.np{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:11px;font-size:22px;font-weight:500;color:var(--text);cursor:pointer;font-family:inherit;-webkit-appearance:none;transition:background .1s}
.np:active{background:var(--border)}
.np.del{color:var(--text2);font-size:18px}
.np.clr{color:var(--red);font-size:13px;font-weight:600}
.thr-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;margin-bottom:8px}
.thr-lbl{font-size:11px;font-weight:600;letter-spacing:.07em;color:var(--text3);margin-bottom:6px}
.thr-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border)}
.thr-row:last-child{border-bottom:none}
.thr-name{font-size:12px;color:var(--text2);line-height:1.3}
.thr-vals{text-align:right;flex-shrink:0;margin-left:8px}
.thr-jpy-val{font-size:30px;font-weight:700}
.thr-jpy-val.t100{color:var(--amber)}
.thr-jpy-val.t800{color:var(--red)}

/* === Claude Code のキャラクター（ヘッダー左上） === */
.header-left{display:flex;align-items:center;gap:4px;min-width:0}
.header{padding-left:10px;padding-right:12px;gap:6px}
.header-left .header-title{white-space:nowrap;font-size:14px}
.header-left .cc-wrap{width:54px}
.cc-wrap { width: 62px; height: 40px; flex-shrink: 0; display: flex; justify-content: center; }
.cc-mascot { display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; padding-top: 4px; }
.cc-mascot svg { width: 36px; height: 27px; shape-rendering: crispEdges; overflow: visible; transform-origin: center; }
/* 歩く・立ち止まる・手足の動きは、下のスクリプト（ccMascot）で1コマずつ動かしている */
.cc-mascot .cc-label { font-family: -apple-system, "Segoe UI", sans-serif; font-size: 7px; letter-spacing: 0.05em; color: #d97757; opacity: 0.8; white-space: nowrap; }
.cc-body { fill: #d97757; }
.cc-eye { fill: #1a1612; transform-box: fill-box; transform-origin: center; }
/* ときどきまばたき */
.cc-eye { animation: cc-blink 4s infinite; }
@keyframes cc-blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
/* === GitHub のマーク（ヘッダー左上、オレンジのキャラクターの右） ===
   横には動かず、その場で：タコの足をゆらゆら・ときどき首をかしげる・ときどき目をパチッ。タップすると1回転 */
.gh-mascot { --gh-disc: #e6edf3; --gh-cat: #111827; --gh-text: #c9d1d9; }   /* ← ヘッダーの背景色（--surface）に合わせている */
.gh-wrap { width: 50px; height: 46px; flex-shrink: 0; display: flex; justify-content: center; align-items: flex-end; margin-right: 6px; }
.gh-mascot { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 46px; gap: 3px; text-decoration: none; }
.gh-mascot svg { width: 24px; height: 24px; overflow: visible; }   /* オレンジのキャラクター（足先まで24px）と上下の端をそろえる */
.gh-label { font-family: -apple-system, "Segoe UI", sans-serif; font-size: 7px; letter-spacing: 0.05em; color: var(--gh-text); opacity: 0.8; white-space: nowrap; }
.gh-disc, .gh-dot { fill: var(--gh-disc); }
.gh-cat { fill: var(--gh-cat); }
.gh-tail-line { fill: none; stroke: var(--gh-cat); stroke-width: 0.8; stroke-linecap: round; }
.gh-all { transform-box: view-box; transform-origin: 8px 8px; }
.gh-head { transform-box: view-box; transform-origin: 8px 10.4px; animation: gh-tilt 5s ease-in-out infinite; }
.gh-tail { transform-box: view-box; transform-origin: 6.5px 12.35px; animation: gh-wag 1.4s ease-in-out infinite alternate; }
/* 目はふだん見せない（ロゴと同じ顔なし）。ときどき一瞬だけ開いてパチッ */
.gh-eyes { fill: var(--gh-disc); transform-box: fill-box; transform-origin: center; animation: gh-wink 6s 2s infinite; }
.gh-mascot.spin .gh-all { animation: gh-spin 0.7s cubic-bezier(0.34,1.4,0.64,1); }
/* 2つのロゴの並びをそろえる：下の文字（Claude Code / GitHub）を同じ高さにし、絵はその上に下ぞろえで置く */
.cc-wrap { height: 46px; align-items: flex-end; }
.cc-mascot { height: 46px; justify-content: flex-end; padding-top: 0; gap: 3px; }
@keyframes gh-tilt { 0%,60%,100% { transform: rotate(0); } 68% { transform: rotate(-9deg); } 78% { transform: rotate(-9deg); } 86% { transform: rotate(6deg); } 92% { transform: rotate(0); } }
@keyframes gh-wag { from { transform: rotate(-14deg); } to { transform: rotate(12deg); } }
@keyframes gh-wink { 0%,88%,100% { transform: scaleY(0); } 90%,95% { transform: scaleY(1); } }
@keyframes gh-spin { 0% { transform: rotate(0) scale(1); } 50% { transform: rotate(180deg) scale(1.15); } 100% { transform: rotate(360deg) scale(1); } }
/* スマホ幅でも1行に収まるよう、ヘッダーの左側を詰める */

.header-left .cc-wrap { width: 46px; }

<script>
/* ===== OPENING ===== */
function startApp(){
  playAnthem();
  var op=document.getElementById('opening');
  op.classList.add('hide');
  setTimeout(function(){op.style.display='none';},700);
}

/* 元の国際小包引受条件検索アプリと同じ音源 */
var _actx=null, _oscs=[];
function _initAudio(){
  if(!_actx) _actx=new(window.AudioContext||window.webkitAudioContext)();
  if(_actx.state==='suspended') _actx.resume();
}
function _stopAll(){
  _oscs.forEach(function(o){try{o.stop();}catch(e){}});
  _oscs=[];
}
function _playTone(freq,duration,delay){
  _initAudio();
  var osc=_actx.createOscillator();
  var gain=_actx.createGain();
  osc.type='square';
  osc.frequency.value=freq;
  gain.gain.setValueAtTime(0.05,_actx.currentTime+delay);
  gain.gain.exponentialRampToValueAtTime(0.001,_actx.currentTime+delay+duration);
  osc.connect(gain);gain.connect(_actx.destination);
  osc.start(_actx.currentTime+delay);
  osc.stop(_actx.currentTime+delay+duration);
  _oscs.push(osc);
}
function playAnthem(){
  _stopAll();
  _initAudio();
  /* 元アプリ playUSAAnthem() の音符データをそのまま使用 */
  var notes=[
    {f:392,d:0.3},{f:329.6,d:0.15},{f:261.6,d:0.45},
    {f:329.6,d:0.3},{f:392,d:0.3},{f:523.3,d:0.6},
    {f:659.3,d:0.3},{f:587.3,d:0.15},{f:523.3,d:0.3},
    {f:329.6,d:0.3},{f:370,d:0.3},{f:392,d:0.6},
    {f:392,d:0.15},{f:392,d:0.15},{f:659.3,d:0.45},
    {f:587.3,d:0.15},{f:523.3,d:0.3},{f:493.9,d:0.3},
    {f:440,d:0.3},{f:493.9,d:0.3},{f:523.3,d:0.6}
  ];
  var t=0;
  notes.forEach(function(n){
    if(n.f>0) _playTone(n.f,n.d*0.9,t);
    t+=n.d;
  });
}
async function fetchRate(){
  var dot=document.getElementById('rdot'),chip=document.getElementById('chipval');
  dot.className='rate-dot loading';chip.textContent='取得中';
  try{
    var r=await fetch('https://open.er-api.com/v6/latest/USD');
    var d=await r.json();
    if(d.result!=='success')throw new Error('fail');
    var rate=Math.round(d.rates.JPY*10)/10;
    currentRate=rate;
    dot.className='rate-dot ok';chip.textContent=rate.toFixed(1);
    document.getElementById('rate-input').value=rate.toFixed(1);
    var now=new Date();
    var hh=now.getHours().toString().padStart(2,'0');
    var mm=now.getMinutes().toString().padStart(2,'0');
    document.getElementById('rate-updated').textContent='取得時刻 '+hh+':'+mm+'\u3000タップで再取得';
    updateThresholds();calcFX();
  }catch(e){
    dot.className='rate-dot err';chip.textContent='エラー';
    document.getElementById('rate-updated').textContent='自動取得できませんでした。レートを手入力するか、右上をタップで再試行。';
  }
}
document.getElementById('rate-input').addEventListener('input',function(){
  currentRate=parseFloat(this.value)||0;
  document.getElementById('chipval').textContent=currentRate?currentRate.toFixed(1):'---';
  document.getElementById('rdot').className='rate-dot'+(currentRate?' ok':'');
  updateThresholds();calcFX();
});
function updateThresholds(){
  var r=currentRate;
  document.getElementById('thr100').textContent=r?Math.round(100*r).toLocaleString():'—';
  document.getElementById('thr800').textContent=r?Math.round(800*r).toLocaleString():'—';
}
var currentRate=0,fxDir='jpy',amtStr='';
function setDir(d){
  fxDir=d;amtStr='';
  document.getElementById('dir-jpy').classList.toggle('active',d==='jpy');
  document.getElementById('dir-usd').classList.toggle('active',d==='usd');
  document.getElementById('dir-label').textContent=d==='jpy'?'円を入力':'ドルを入力';
  document.getElementById('res-unit').textContent=d==='jpy'?'ドル':'円';
  document.getElementById('res-label').textContent=d==='jpy'?'ドル換算':'円換算';
  document.getElementById('amount-wrap').classList.remove('has-value');
  renderAmt();calcFX();
}
function np(k){
  if(k==='C'){amtStr='';}
  else if(k==='DEL'){amtStr=amtStr.slice(0,-1);}
  else if(k==='.'&&amtStr.includes('.')){}
  else if(amtStr.length<10){amtStr+=k;}
  renderAmt();calcFX();
}
function renderAmt(){
  var el=document.getElementById('amount-disp');
  var wrap=document.getElementById('amount-wrap');
  if(!amtStr||amtStr==='0'){el.textContent='0';el.classList.add('empty');wrap.classList.remove('has-value');}
  else{el.textContent=parseFloat(amtStr).toLocaleString('ja-JP',{maximumFractionDigits:2});el.classList.remove('empty');wrap.classList.add('has-value');}
}
function calcFX(){
  var r=currentRate,amt=parseFloat(amtStr)||0,resEl=document.getElementById('res-amount'),usd=0;
  if(!r||!amt){resEl.textContent='—';updateJudgment(0);return;}
  if(fxDir==='jpy'){usd=amt/r;resEl.textContent=usd.toFixed(2);}
  else{usd=amt;resEl.textContent=Math.round(amt*r).toLocaleString();}
  updateJudgment(usd);
}
function updateJudgment(usd){
  var wrap=document.getElementById('judgment-wrap');
  if(!usd){wrap.innerHTML='';return;}
  var cls,label,badge;
  if(usd<=100){cls='under';label='100ドル以下';badge='免税対象・全局OK';}
  else if(usd<=800){cls='mid';label='100〜800ドル';badge='Zonos事前支払い必要';}
  else{cls='over';label='800ドル超';badge='事前支払い不要・指定局のみ';}
  wrap.innerHTML='<div class="jrow '+cls+'"><span class="jlabel '+cls+'">'+label+'</span><span class="jbadge '+cls+'">'+badge+'</span></div>';
}
function switchTab(t){
  ['flow','fx'].forEach(function(id){
    document.getElementById('screen-'+id).classList.toggle('active',id===t);
    document.getElementById('tab-'+id).classList.toggle('active',id===t);
  });
}
var steps=[
  {id:'q1',q:'書類・はがき・印刷物・EMS書類ですか？',sub:'内容品の価格は問いません。',yes:'ok_all',no:'q2'},
  {id:'q2',q:'100ドル以下の個人間贈答品ですか？',sub:'フリマ・ネット販売の荷物は「販売品」扱いです。',yes:'ok_all',no:'q3'},
  {id:'q3',q:'内容品価格が800ドルを超えますか？',sub:'申告価格をご確認ください。',yes:'ok_800over',no:'q4'},
  {id:'q4',q:'Zonosアプリで関税の事前支払いは完了していますか？',sub:'お客さまご自身のスマホで操作（局タブレット不可）。',yes:'q5',no:'need_zonos'},
  {id:'q5',q:'ラベルに「DDP」の表示はありますか？',sub:'「DDP-13桁の申告番号」の表示を確認してください。',yes:'ok_steps',no:'no_ddp'}
];

  ok_800over:{type:'warn',badge:'引受OK（指定局のみ）',title:'指定郵便局でお受けください',body:'800ドル超のため関税事前支払いは不要です。ただし指定郵便局のみでの受付です。'},
  ok_steps:{type:'ok',badge:'引受OK（指定局のみ）',title:'条件が揃っています',body:'指定郵便局でお受けできます。'},

    note:'アプリ操作の質問はZonos社へ。局のタブレットでは利用できません。'},
  no_ddp:{type:'steps',badge:'手書き対応が必要',title:'DDPの手書き記載をご案内ください',

    note:'支払い済みにもかかわらず表示がない場合はこの対応でOKです。'}
};
var current='q1',hist=[],totalSteps=steps.length;
function getStep(id){return steps.find(function(s){return s.id===id;});}
function renderProgress(){
  var bar=document.getElementById('progress');bar.innerHTML='';
  var idx=steps.findIndex(function(s){return s.id===current;});
  for(var i=0;i<totalSteps;i++){
    var d=document.createElement('div');
    d.className='pip'+(i<hist.length?' done':i===hist.length&&idx>=0?' active':'');
    bar.appendChild(d);
  }
}
function renderHistory(){
  var h=document.getElementById('history-wrap');
  if(!hist.length){h.innerHTML='';return;}
  h.innerHTML='<div class="hlist">'+hist.map(function(r){
    return '<div class="hrow"><span class="hq">'+r.q+'</span><span class="ha '+(r.ans==='はい'?'yes':'no')+'">'+r.ans+'</span></div>';
  }).join('')+'</div>';
}
function renderMain(){
  var m=document.getElementById('flow-main');
  var step=getStep(current);
  if(!step){
    var r=results[current];if(!r){m.innerHTML='';return;}
    var html='<div class="rcard '+r.type+'"><div class="rbadge '+r.type+'">'+r.badge+'</div><div class="rtitle '+r.type+'">'+r.title+'</div>';
    if(r.body)html+='<div class="rbody">'+r.body+'</div>';
    if(r.steps)r.steps.forEach(function(s,i){html+='<div class="srow"><div class="snum">'+(i+1)+'</div><div class="stext">'+s+'</div></div>';});
    if(r.note)html+='<div class="rnote">'+r.note+'</div>';
    html+='</div><button class="reset-btn" onclick="reset()">最初からやり直す</button>';
    m.innerHTML=html;return;
  }
  var si=steps.findIndex(function(s){return s.id===current;})+1;
  m.innerHTML='<div class="q-card"><div class="q-step">質問 '+si+' / '+totalSteps+'</div><div class="q-text">'+step.q+'</div><div class="q-sub">'+step.sub+'</div></div>'
    +'<div class="btn-row"><button class="btn btn-yes" onclick="answer(\'yes\')">はい</button><button class="btn btn-no" onclick="answer(\'no\')">いいえ</button></div>';
}
function answer(ans){
  var step=getStep(current);if(!step)return;
  hist.push({q:step.q,ans:ans==='yes'?'はい':'いいえ'});
  current=ans==='yes'?step.yes:step.no;
  renderProgress();renderHistory();renderMain();
}
function reset(){current='q1';hist=[];renderProgress();renderHistory();renderMain();}
renderProgress();renderMain();
fetchRate();

// Claude Code のキャラクター（ヘッダー左上）
//   右へ歩く → 端で立ち止まって手足をちょこちょこ動かし、振り向く → 左へ戻る … を繰り返す
// =============================================================
(function ccMascot() {
  const svg = document.querySelector('.cc-mascot svg');
  if (!svg) return;
  const body = svg.querySelector('.cc-hop');
  const armL = svg.querySelector('.cc-arm-l');
  const armR = svg.querySelector('.cc-arm-r');
  const legs = Array.from(svg.querySelectorAll('.cc-leg')); // 左から順に4本

  const HALF = 12;        // 真ん中から左右それぞれに歩く幅（px）
  const STEP = 2;         // 1歩で進む距離（px）
  const TICK = 220;       // 1コマの長さ（ミリ秒）
  const IDLE_TICKS = 9;   // 端で立ち止まるコマ数

  let x = -HALF, dir = 1, mode = 'idle', t = 0;

  const legUp = (i, up) => legs[i].setAttribute('height', up ? 1 : 2);
  const armUp = (el, up) => el.setAttribute('y', up ? 1 : 2);
  const bob = up => body.setAttribute('transform', up ? 'translate(0,-1)' : '');
  const rest = () => { legs.forEach((_, i) => legUp(i, false)); armUp(armL, false); armUp(armR, false); bob(false); };
  const draw = () => { svg.style.transform = `translateX(${x}px) scaleX(${dir})`; };

  function tick() {
    t++;
    if (mode === 'walk') {
      // 歩く：外側2本と内側2本の足を交互に上げ、体も小さく弾ませる
      const ph = t % 2;
      armUp(armL, false); armUp(armR, false);
      legUp(0, ph === 0); legUp(2, ph === 0);
      legUp(1, ph === 1); legUp(3, ph === 1);
      bob(ph === 0);
      x += STEP * dir;
      if (x <= -HALF || x >= HALF) {
        x = Math.max(-HALF, Math.min(HALF, x));
        mode = 'idle'; t = 0; rest();
      }
    } else {
      // 立ち止まり：両腕を交互に上げ下げし、端の足でトントンと足踏み
      const ph = t % 4;
      armUp(armL, ph === 1);
      armUp(armR, ph === 3);
      legUp(0, ph === 2);
      legUp(3, ph === 0);
      bob(false);
      if (t === Math.floor(IDLE_TICKS / 2)) dir = (x >= HALF) ? -1 : 1; // 途中で振り向く
      if (t >= IDLE_TICKS) { mode = 'walk'; t = 0; rest(); }
    }
    draw();
  }

  draw();
  setInterval(tick, TICK);
})();

// ホーム画面アイコン：元のアイコン画像の左上に Claude Code のキャラクターを描き足す
(function ccIcon() {
  const appleIcon = document.getElementById('appleIcon');
  const favIcon = document.getElementById('favIcon');
  if (!appleIcon) return;
  const img = new Image();
  img.onload = function() {
    const canvas = document.createElement('canvas');
    canvas.width = img.width; canvas.height = img.height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);
    var p=2, ox=52, oy=4;   // 1ドットの大きさと左上の位置（180pxアイコン。「米国EMS」の文字の上、iPhoneの丸い角で欠けない位置）
    var px=function(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(ox+x*p,oy+y*p,w*p,h*p);};
    var o='#d97757';
    px(2,0,8,6,o); px(0,2,2,2,o); px(10,2,2,2,o);               // 体と両腕
    px(2,6,1,2,o); px(4,6,1,2,o); px(7,6,1,2,o); px(9,6,1,2,o); // 足4本
    px(3,1,1,1,'#1a1612'); px(8,1,1,1,'#1a1612');               // 目
    const url = canvas.toDataURL('image/png');
    appleIcon.href = url;
    if (favIcon) favIcon.href = url;
  };
  img.src = appleIcon.href;
})();

// GitHub のマーク：タップするとくるっと1回転（そのあと GitHub のページが別のタブで開く）
(function ghMascot() {
  const gh = document.querySelector('.gh-mascot');
  if (!gh) return;
  gh.addEventListener('pointerdown', function() {
    gh.classList.remove('spin'); void gh.offsetWidth; gh.classList.add('spin');
  });
  gh.addEventListener('animationend', function(e) {
    if (e.animationName === 'gh-spin') gh.classList.remove('spin');
  });
})();
